# Gradle Daemon JVM criteria (Gradle 8.8+).
#
# AGP 8.7.3 refuses to run on anything below Java 17, and the daemon otherwise
# inherits whatever `java` happens to be on PATH — which on a machine with an
# older default JDK means a bare `./gradlew` fails during configuration.
#
# This pins the requirement by *version*, not by path, so it holds on any machine
# or CI runner that has some JDK 17 installed. If Gradle cannot find one it says so
# instead of silently building on the wrong JVM.
#
# This is the JVM Gradle and AGP themselves run in. It is not the compilation
# target: that stays fixed at 17 by `jvmToolchain(17)` in :app and :core and by
# `compileOptions` in :app, independently of this file.
toolchainVersion=17
